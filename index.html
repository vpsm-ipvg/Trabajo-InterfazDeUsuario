<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FORO ESTUDIANTES IPVG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, .card, .modal-content, .form-control, .form-select {
            transition: background-color .2s ease, color .2s ease, border-color .2s ease;
        }
    </style>
</head>
<body class="bg-body text-body">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark p-3" style="background-color:#0b1466 !important;">
            <div class="container-fluid" id="BarraDeNavegacion">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <img src="https://intranet.virginiogomez.cl/intranet/galeria/logos_vg/Logo_VG_blanco.png" alt="Logo" width="200" height="50">
                    <span style="font-family:Arial;font-weight:bold;">FORO IPVG</span>
                </a>
                <button class="navbar-toggler col-12 col-md-12" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContenido">
                    <form id="formularioBusqueda" class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" role="search">
                        <input id="buscadorHilos" class="form-control me-2" type="search" placeholder="Buscar en el foro..." aria-label="Buscar por palabra clave">
                        <button class="btn btn-outline-light" type="submit">Buscar</button>
                    </form>
                    <div class="d-flex p-2">
                        <button id="btnCambiarTema" class="btn btn-outline-light text-nowrap rounded-5 col-12 col-md-12" type="button" style="font-size:25px;" aria-label="Cambiar tema" title="Cambiar a tema oscuro">◐</button>
                    </div>
                    <div class="d-flex p-2">
                        <button class="btn btn-primary text-nowrap col-12 col-md-12" type="button" data-bs-toggle="modal" data-bs-target="#modalCrearHilo">Crear hilo</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h2 class="mb-4">Hilos del foro</h2>
        <section id="listaHilos" aria-live="polite"></section>
    </main>

    <div class="modal fade" id="modalCrearHilo" tabindex="-1" aria-labelledby="tituloModalHilo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background-color:#0b1466;color:white;">
                    <h5 class="modal-title" id="tituloModalHilo">Crear nuevo hilo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearHilo">
                        <div class="mb-3">
                            <label for="nombreInvitadoHilo" class="form-label">Nombre de invitado (opcional)</label>
                            <input type="text" class="form-control" id="nombreInvitadoHilo" maxlength="40"
                                   placeholder="Ej.: Estudiante IPVG">
                            <div class="form-text">Si lo dejas vacío, tu publicación aparecerá como "Invitado".</div>
                        </div>
                        <div class="mb-3">
                            <label for="tituloHilo" class="form-label">Título del hilo</label>
                            <input type="text" class="form-control" id="tituloHilo" maxlength="120" placeholder="Escribe el título de tu publicación" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoriaHilo" class="form-label">Categoría</label>
                            <select class="form-select" id="categoriaHilo" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="Académico">Académico</option>
                                <option value="Consultas">Consultas</option>
                                <option value="Comunidad">Comunidad</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="contenidoHilo" class="form-label">Contenido</label>
                            <textarea class="form-control" id="contenidoHilo" rows="5" placeholder="Escribe aquí el contenido de tu hilo..." required></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Publicar hilo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/foro.js"></script>

    <!-- Ventana flotante para ver un hilo y responder -->
    <div class="modal fade" id="modalVerHilo" tabindex="-1" aria-labelledby="tituloModalHilo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalHilo">Hilo del foro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="detalleHilo"></div>
                    <hr>
                    <h6 class="mb-3">Respuestas</h6>
                    <div id="listaRespuestas" class="mb-3"></div>
                    <form id="formResponderHilo">
                        <label for="textoRespuesta" class="form-label">Escribe tu respuesta</label>
                        <textarea id="textoRespuesta" class="form-control mb-3" rows="3" placeholder="Comparte tu opinión..." required></textarea>
                        <button type="submit" class="btn btn-primary">Publicar respuesta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
